<!doctype html>
<!--
  Fonte da imagem que aparece quando o link é compartilhado (compartilhar.png).
  Não vai para o ar: fica em ferramentas/, que está no .assetsignore.

  Para gerar de novo, na raiz do repositório:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless \
      --disable-gpu --hide-scrollbars --force-device-scale-factor=1 \
      --window-size=1200,630 --screenshot=compartilhar.png \
      "file://$PWD/ferramentas/imagem-compartilhar.html"

  1200×630 é o tamanho que WhatsApp, Facebook, LinkedIn e X esperam.
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Archivo'; font-weight: 600; src: url(../fonts/archivo-latin-600-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Spectral'; font-weight: 400; src: url(../fonts/spectral-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Spectral'; font-weight: 600; src: url(../fonts/spectral-latin-600-normal.woff2) format('woff2'); }

  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; box-sizing: border-box;
    padding: 72px 88px;
    background: #F3F4F0; color: #151D19;
    font-family: 'Spectral', Georgia, serif;
    display: flex; flex-direction: column; justify-content: space-between;
    border-bottom: 14px solid #2E6A52;
    -webkit-font-smoothing: antialiased;
  }
  .marca {
    display: flex; align-items: center; gap: 18px;
    font-family: 'Archivo', Arial, sans-serif; font-weight: 600;
    font-size: 26px; letter-spacing: 0.12em; text-transform: uppercase; color: #4E5A53;
  }
  h1 { margin: 0 0 22px; font-weight: 600; font-size: 92px; line-height: 1.02; letter-spacing: -0.01em; }
  p  { margin: 0; font-size: 40px; line-height: 1.3; color: #4E5A53; max-width: 1024px; }
  .rodape {
    display: flex; justify-content: space-between; align-items: baseline;
    font-family: 'Archivo', Arial, sans-serif; font-weight: 600; font-size: 26px;
  }
  .rodape .endereco { color: #2E6A52; }
  .rodape .aviso { color: #6E796F; }
</style>
</head>
<body>
  <div class="marca">
    <svg width="52" height="52" viewBox="0 0 32 32" aria-hidden="true">
      <circle cx="12.6" cy="16" r="6.6" fill="#2E6A52"/>
      <circle cx="20.4" cy="16" r="6.6" fill="none" stroke="#2E6A52" stroke-width="2.6"/>
    </svg>
    Sou Próximo
  </div>
  <div>
    <h1>Calculadora de dívidas</h1>
    <p>Some tudo o que você deve e veja em que ordem pagar.</p>
  </div>
  <div class="rodape">
    <span class="endereco">souproximo.org/dividas</span>
    <span class="aviso">Nada do que você digitar sai do seu aparelho</span>
  </div>
</body>
</html>
