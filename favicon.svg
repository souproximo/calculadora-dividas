<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Sou Próximo">
  <style>
    :root { --paper: #F3F4F0; --mark: #2E6A52; }
    @media (prefers-color-scheme: dark) {
      :root { --paper: #121714; --mark: #7FBE9C; }
    }
    .paper { fill: var(--paper); }
    .mark  { fill: var(--mark); }
    .ring  { fill: none; stroke: var(--mark); stroke-width: 2.6; }
  </style>
  <rect class="paper" width="32" height="32" rx="6"/>
  <circle class="mark" cx="12.6" cy="16" r="6.6"/>
  <circle class="ring" cx="20.4" cy="16" r="6.6"/>
</svg>
